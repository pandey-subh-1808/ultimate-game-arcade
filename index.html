<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ultimate Arcade Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--night:#150d2e;--cab:#241552;--cab2:#2f1d6b;--edge:#4b33a0;--ink:#fff3dc;--mute:#a99bd6;--pink:#ff4f8b;--cyan:#38e1ff;--sun:#ffc93c;--mint:#5df2a6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:radial-gradient(ellipse at 50% 115%,#6a2178 0,#150d2e 62%);color:var(--ink);font-family:'Nunito',sans-serif;display:grid;place-items:center;overflow:hidden;touch-action:none}
.hidden{display:none!important}
.cab{position:relative;width:min(96vw,400px);height:min(96vh,720px);background:linear-gradient(180deg,var(--cab2),var(--cab));border-radius:28px;border:3px solid var(--edge);box-shadow:0 0 0 6px #120a29,0 0 70px rgba(255,79,139,.35),0 25px 50px #000;display:flex;flex-direction:column;overflow:hidden}
.cab::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#120a29;border-bottom:3px solid var(--pink);box-shadow:0 4px 20px rgba(255,79,139,.4);z-index:5}
.bar h1{flex:1;font:400 17px Bungee,sans-serif;letter-spacing:1px;color:var(--sun);text-shadow:0 0 12px rgba(255,201,60,.7);text-align:center}
.ib{width:40px;height:40px;border-radius:12px;border:2px solid var(--edge);background:#1b1040;color:var(--ink);font-size:17px;cursor:pointer}
.ib:active{transform:scale(.92)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px;gap:12px;overflow-y:auto}
.hint{color:var(--mute);font-size:13px;font-weight:700;text-align:center}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:20px;color:#fff;text-align:left;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.card:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.card .em{font-size:38px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.card b{display:block;font:400 17px Bungee,sans-serif;letter-spacing:.5px}
.card small{display:block;font-weight:700;font-size:12px;opacity:.9;margin-top:2px}
.c1{background:linear-gradient(135deg,#12b886,#0c7a8a)}.c2{background:linear-gradient(135deg,#ff4f8b,#c2255c)}.c3{background:linear-gradient(135deg,#4c6ef5,#7048e8)}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--sun);color:#3a2300;font:400 16px Bungee,sans-serif;cursor:pointer;box-shadow:0 5px 0 #b57f00}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57f00}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--edge);font-size:13px;padding:10px;margin-top:8px}
.lab{font-weight:900;font-size:13px;color:var(--cyan);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:2px solid var(--edge);background:#1b1040;color:var(--ink);font:800 12px Nunito,sans-serif;cursor:pointer}
.chip.on{background:var(--cyan);color:#150d2e;border-color:var(--cyan);box-shadow:0 0 14px rgba(56,225,255,.5)}
.name{width:100%;padding:12px;border-radius:14px;border:2px solid var(--edge);background:#1b1040;color:var(--ink);font:800 14px Nunito,sans-serif;outline:0}
.name:focus{border-color:var(--cyan)}
details{background:#1b1040;border:2px solid var(--edge);border-radius:14px;padding:10px 12px}
summary{font-weight:900;font-size:13px;cursor:pointer;color:var(--sun)}
.li{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:5px 0;border-bottom:1px dashed #3b2a80}
.li:last-child{border:0}.on-t{color:var(--mint)}.off-t{color:#6f60a6}
.hud{display:flex;gap:8px;padding:8px 12px}
.pill{flex:1;background:#1b1040;border:2px solid var(--edge);border-radius:12px;padding:4px 8px;text-align:center}
.pill small{display:block;font-size:10px;font-weight:900;color:var(--mute)}
.pill b{font:400 15px Bungee,sans-serif}
.stage{flex:1;min-height:0;display:grid;place-items:center;margin:0 8px 8px;background:#120a29;border-radius:14px;overflow:hidden;border:2px solid var(--edge)}
canvas{display:block;touch-action:none}
.ov{position:absolute;inset:0;z-index:40;background:rgba(21,13,46,.9);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px}
.ovc{width:100%;background:linear-gradient(180deg,#34206f,#241552);border:3px solid var(--pink);border-radius:24px;padding:18px;text-align:center;box-shadow:0 0 40px rgba(255,79,139,.4);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ovc .ico{font-size:44px}.ovc h2{font:400 24px Bungee,sans-serif;color:var(--pink);margin:2px 0}
.ovc p{color:var(--mute);font-weight:700;font-size:13px;margin-bottom:12px}
.stats{background:#1b1040;border-radius:14px;padding:8px 12px;margin-bottom:14px;text-align:left}
.stats .li b{color:var(--sun)}
.turn{text-align:center;font:400 18px Bungee,sans-serif}
.tally{display:flex;gap:8px}.tally div{flex:1;text-align:center;background:#1b1040;border:2px solid var(--edge);border-radius:12px;padding:5px;font-weight:900;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 auto;width:100%;max-width:260px}
.zone{border-radius:18px;padding:10px;border:2px solid var(--edge);background:#1b1040;transition:opacity .2s}
.zone.on{border-color:var(--cyan);box-shadow:0 0 20px rgba(56,225,255,.35)}.zone.dim{opacity:.45;pointer-events:none}
.zone h3{font:400 12px Bungee,sans-serif;text-align:center;margin-bottom:8px;color:var(--cyan)}
.cell{aspect-ratio:1;border:0;border-radius:14px;background:#33227a;color:var(--ink);font:400 34px Bungee,sans-serif;cursor:pointer;box-shadow:0 4px 0 #170d3d}
.cell:active{transform:translateY(3px);box-shadow:0 1px 0 #170d3d}
.cell.sm{font-size:24px}.cell.mX{color:var(--mint)}.cell.mO{color:var(--sun)}
.cell.win{background:var(--pink);color:#fff;animation:pop .3s}.cell.safe{background:#1d6b55}.cell.boom{background:#8a1c3c;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.modebar{display:flex;gap:8px;margin:2px 0 4px}.modebar .chip{flex:1}.mode-label{font-size:11px;color:var(--mute);font-weight:900;text-align:center;margin-bottom:2px}.ai-note{color:var(--cyan);font-size:12px;font-weight:800;text-align:center;min-height:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="cab">
  <div class="bar">
    <button class="ib hidden" id="back" aria-label="Back to hub">🏠</button>
    <h1 id="ttl">ARCADE HUB</h1>
    <button class="ib hidden" id="pz" aria-label="Pause">⏸</button>
  </div>

  <section id="hub" class="screen" style="justify-content:center">
    <p class="hint">Pick a game. Beat your best.</p>
    <button class="card c1" data-g="snake"><span class="em">🐍</span><span><b>Snake</b><small id="best">Eat, grow, don't crash</small></span></button>
    <button class="card c2" data-g="mine"><span class="em">💣</span><span><b>Mine-Tac-Toe</b><small>Dodge a mine, then place your mark</small></span></button>
    <button class="card c3" data-g="ttt"><span class="em">❌</span><span><b>Tic-Tac-Toe</b><small>Two players, one phone</small></span></button>
  </section>

  <section id="setup" class="screen hidden">
    <div><div class="lab">Mode</div><div class="row" id="r-mode"></div></div>
    <div><div class="lab">Snake style</div><div class="row" id="r-style"></div></div>
    <div><div class="lab">Speed</div><div class="row" id="r-speed"></div></div>
    <div><div class="lab">Theme</div><div class="row" id="r-theme"></div></div>
    <input class="name" id="pname" maxlength="12" placeholder="Your player name">
    <details><summary>Top players</summary><div id="lb-s"></div></details>
    <details><summary>Achievements</summary><div id="ach"></div></details>
    <button class="btn" id="go">Start game</button>
  </section>

  <section id="play" class="screen hidden" style="padding:0;gap:0">
    <div class="hud">
      <div class="pill"><small>SCORE</small><b id="sc" style="color:var(--mint)">0</b></div>
      <div class="pill"><small>SPEED</small><b id="sp" style="color:var(--pink)">1.0x</b></div>
      <div class="pill"><small>BUFF</small><b id="bf" style="color:var(--sun);font-size:11px;line-height:21px">NONE</b></div>
    </div>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  </section>

  <section id="tt" class="screen hidden"></section>
  <div id="ov" class="ov hidden"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let timer=null,cur=null;

/* ---------- navigation ---------- */
function go(id,title,pause){
  ['hub','setup','play','tt'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
  $('#ttl').textContent=title;
  $('#back').classList.toggle('hidden',id==='hub');
  $('#pz').classList.toggle('hidden',!pause);
}
function home(){clearInterval(timer);clearTimeout(aiTimer);hideOv();cur=null;go('hub','ARCADE HUB');const b=lb()[0];$('#best').textContent=b?`Best: ${b.score} by ${b.name}`:'Eat, grow, don\'t crash'}
function hideOv(){$('#ov').classList.add('hidden')}
function overlay(o){
  $('#ov').innerHTML=`<div class="ovc"><div class="ico">${o.ico}</div><h2>${o.t}</h2><p>${o.s}</p>${o.b||''}<button class="btn" id="ovp">${o.pl}</button><button class="btn ghost" id="ovq">Back to hub</button></div>`;
  $('#ov').classList.remove('hidden');
  $('#ovp').onclick=()=>{hideOv();o.pf()};$('#ovq').onclick=home;
}
$('#back').onclick=home;
$$('.card').forEach(c=>c.onclick=()=>{const g=c.dataset.g;cur=g;
  if(g==='snake'){go('setup','SNAKE');renderLists()}
  else if(g==='mine'){go('tt','MINE-TAC-TOE');tally={X:0,O:0,D:0};newMine()}
  else{go('tt','TIC-TAC-TOE');tally={X:0,O:0,D:0};newC()}});

/* ---------- data ---------- */
const LB='snake_arcade_live_v1',AK='snake_arcade_achv_v2';
const lb=()=>{const a=store.get(LB,[]);return Array.isArray(a)?a:[]};
const AD={bite:'First Bite',m20:'Snake Master (20 pts)',len:'Centipede (25 segments)',turbo:'Speed Demon (Turbo)',pu:'Power Hungry',trap:'Trap Survivor (10 pts)',c50:'Century Club (50 pts)',wrap:'Warp Runner (15 pts)'};
let ach=store.get(AK,{});
function unlock(k){if(!ach[k]){ach[k]=1;store.set(AK,ach)}}
function renderLists(){
  $('#lb-s').innerHTML=lb().slice(0,5).map((e,i)=>`<div class="li"><span>${i+1}. ${esc(e.name)}</span><b>${e.score} pts</b></div>`).join('')||'<div class="hint">No scores yet. Be the first.</div>';
  $('#ach').innerHTML=Object.entries(AD).map(([k,n])=>`<div class="li"><span>${n}</span><span class="${ach[k]?'on-t':'off-t'}">${ach[k]?'Unlocked':'Locked'}</span></div>`).join('');
}

/* ---------- snake setup ---------- */
const cfg={mode:'Wrap',color:'#38e1ff',eyes:0,speed:80,theme:0};
const STY=[{l:'Cyan',c:'#38e1ff'},{l:'Pink',c:'#ff4f8b'},{l:'Lime',c:'#5df2a6'},{l:'Cute eyes',c:'#ffc93c',e:1}];
const THM=[{l:'Obsidian',bg:'#120a29',g:'#2a1c5c'},{l:'Cyberpunk',bg:'#1a0b2e',g:'#5a2a8c'},{l:'Emerald',bg:'#062419',g:'#13694b'},{l:'Sunset',bg:'#2a0f20',g:'#7a2a50'},{l:'Ocean',bg:'#0b1e36',g:'#1f528c'}];
function chips(id,items,pick,start){
  const el=$('#'+id);
  el.innerHTML=items.map((it,i)=>`<button class="chip ${i===start?'on':''}">${it.l}</button>`).join('');
  [...el.children].forEach((b,i)=>b.onclick=()=>{[...el.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');pick(items[i],i)});
}
chips('r-mode',[{l:'Normal',v:'Normal'},{l:'Wrap',v:'Wrap'},{l:'Trap (2x)',v:'Trap'}],x=>cfg.mode=x.v,1);
chips('r-style',STY,x=>{cfg.color=x.c;cfg.eyes=x.e||0},0);
chips('r-speed',[{l:'Slow',v:120},{l:'Normal',v:80},{l:'Fast',v:55},{l:'Turbo',v:35}],x=>{cfg.speed=x.v;if(x.v===35)unlock('turbo')},1);
chips('r-theme',THM,(x,i)=>cfg.theme=i,0);
$('#go').onclick=startSnake;

/* ---------- snake game ---------- */
const B=20,cv=$('#cv'),cx=cv.getContext('2d');
let cols,rows,S;
const PU={gem:'💎',ghost:'👻',doubler:'✖2',mega:'🍉'},PK=Object.keys(PU);
const FOOD={'#38e1ff':'#ffc93c','#ff4f8b':'#5df2a6','#5df2a6':'#ff4f8b','#ffc93c':'#ff4f8b'};
const occ=(x,y)=>S.snake.some(s=>s.x===x&&s.y===y)||S.traps.some(s=>s.x===x&&s.y===y)||(S.food&&S.food.x===x&&S.food.y===y)||(S.pu&&S.pu.x===x&&S.pu.y===y);
function free(){let x,y,n=0;do{x=Math.random()*cols|0;y=Math.random()*rows|0}while(occ(x,y)&&++n<500);return{x,y}}
function startSnake(){
  go('play','SNAKE',1);hideOv();
  const st=$('#stage');cols=Math.max(10,(st.clientWidth-4)/B|0);rows=Math.max(12,(st.clientHeight-4)/B|0);
  cv.width=cols*B;cv.height=rows*B;
  const mx=cols>>1,my=rows>>1;
  S={snake:[{x:mx-2,y:my},{x:mx-1,y:my},{x:mx,y:my}],dir:{x:1,y:0},q:[],food:null,pu:null,life:0,traps:[],buff:null,bt:0,score:0,ms:cfg.speed,over:0,pause:0};
  if(cfg.mode==='Trap')while(S.traps.length<5){const c=free();if(c.y!==my)S.traps.push(c)}
  spawn();hud();draw();loop();
}
function loop(){clearInterval(timer);timer=setInterval(tick,S.ms)}
function spawn(){
  S.food=free();
  if(!S.pu&&Math.random()<.35){S.pu={...free(),t:PK[Math.random()*PK.length|0]};S.life=80}
}
function turn(x,y){
  if(!S||S.over||S.pause||cur!=='snake')return;
  const l=S.q.length?S.q[S.q.length-1]:S.dir;
  if((x===-l.x&&y===-l.y)||(x===l.x&&y===l.y)||S.q.length>1)return;
  S.q.push({x,y});
}
function tick(){
  if(S.pause||S.over)return;
  if(S.bt>0&&--S.bt===0)S.buff=null;
  if(S.pu&&--S.life<=0)S.pu=null;
  if(S.q.length)S.dir=S.q.shift();
  const h=S.snake[S.snake.length-1];let n={x:h.x+S.dir.x,y:h.y+S.dir.y};
  if(cfg.mode==='Wrap'){n.x=(n.x+cols)%cols;n.y=(n.y+rows)%rows}
  else if(n.x<0||n.y<0||n.x>=cols||n.y>=rows)return over('You hit the wall.');
  if(S.buff!=='ghost'&&S.snake.slice(1).some(s=>s.x===n.x&&s.y===n.y))return over('You ran into yourself.');
  if(cfg.mode==='Trap'&&S.traps.some(t=>t.x===n.x&&t.y===n.y))return over('You hit a spike trap.');
  S.snake.push(n);
  if(n.x===S.food.x&&n.y===S.food.y){
    let p=cfg.mode==='Trap'?2:1;if(S.buff==='doubler')p*=2;S.score+=p;unlock('bite');
    const f=1+Math.floor(S.score/3)*.05,ms=Math.max(25,Math.floor(cfg.speed/f));
    spawn();if(ms!==S.ms){S.ms=ms;loop()}
  }else if(S.pu&&n.x===S.pu.x&&n.y===S.pu.y){
    S.buff=S.pu.t;S.bt=60;unlock('pu');
    if(S.buff==='gem')S.score+=5;if(S.buff==='mega')S.score+=10;S.pu=null;
  }else S.snake.shift();
  const sc=S.score;
  if(cfg.mode==='Trap'&&sc>=10)unlock('trap');if(cfg.mode==='Wrap'&&sc>=15)unlock('wrap');
  if(sc>=20)unlock('m20');if(sc>=50)unlock('c50');if(S.snake.length>=25)unlock('len');
  store.set(AK,ach);hud();draw();
}
function hud(){
  $('#sc').textContent=S.score;$('#sp').textContent=(cfg.speed/S.ms).toFixed(1)+'x';
  $('#bf').textContent=S.buff?`${S.buff.toUpperCase()} ${Math.ceil(S.bt/10)}`:'NONE';
}
function dot(x,y,r,c,glow){cx.fillStyle=c;cx.shadowColor=c;cx.shadowBlur=glow||0;cx.beginPath();cx.arc(x*B+B/2,y*B+B/2,r,0,7);cx.fill();cx.shadowBlur=0}
function draw(){
  const T=THM[cfg.theme];
  cx.fillStyle=T.bg;cx.fillRect(0,0,cv.width,cv.height);
  cx.fillStyle=T.g;
  for(let x=0;x<cols;x++)for(let y=0;y<rows;y++)cx.fillRect(x*B+B/2-1,y*B+B/2-1,2,2);
  S.traps.forEach(t=>{dot(t.x,t.y,B/2-2,'#ff3b5c',10);cx.fillStyle='#fff';cx.font='bold 12px Nunito';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('✕',t.x*B+B/2,t.y*B+B/2+1)});
  dot(S.food.x,S.food.y,B/2-3,FOOD[cfg.color],16);
  if(S.pu){cx.globalAlpha=S.life<20&&S.life%2?.4:1;cx.font='15px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';cx.fillText(PU[S.pu.t],S.pu.x*B+B/2,S.pu.y*B+B/2+1);cx.globalAlpha=1}
  const len=S.snake.length,gh=S.buff==='ghost';
  S.snake.forEach((s,i)=>{
    const head=i===len-1;cx.globalAlpha=gh?.45:.5+.5*i/len;
    dot(s.x,s.y,B/2-1-(i<3?(3-i)*.9:0),cfg.color,head?14:0);cx.globalAlpha=1;
    if(head){
      const d=S.dir,px=-d.y,py=d.x,er=cfg.eyes?4:3;
      [-1,1].forEach(k=>{const ex=s.x*B+B/2+d.x*3+px*4*k,ey=s.y*B+B/2+d.y*3+py*4*k;
        cx.fillStyle='#fff';cx.beginPath();cx.arc(ex,ey,er,0,7);cx.fill();
        cx.fillStyle='#150d2e';cx.beginPath();cx.arc(ex+d.x*1.2,ey+d.y*1.2,er/2.2,0,7);cx.fill()});
    }
  });
}
function over(reason){
  S.over=1;clearInterval(timer);
  const name=($('#pname').value.trim()||'Player').slice(0,12),prev=lb()[0];
  let list=lb();
  if(S.score>0){list.push({name,score:S.score,mode:cfg.mode});list.sort((a,b)=>b.score-a.score);list=list.slice(0,10);store.set(LB,list)}
  const best=list[0]?list[0].score:0,isNew=S.score>0&&(!prev||S.score>prev.score);
  overlay({ico:isNew?'🏆':'💥',t:isNew?'NEW BEST!':'GAME OVER',s:reason,pl:'Play again',pf:startSnake,
    b:`<div class="stats"><div class="li"><span>Score</span><b>${S.score}</b></div><div class="li"><span>Top speed</span><b>${(cfg.speed/S.ms).toFixed(1)}x</b></div><div class="li"><span>High score</span><b>${best}</b></div></div>`});
}
$('#pz').onclick=()=>{
  if(cur!=='snake'||!S||S.over)return;
  S.pause=1;overlay({ico:'⏸',t:'PAUSED',s:`Score: ${S.score}`,pl:'Resume',pf:()=>S.pause=0});
};

/* ---------- tic-tac-toe shared ---------- */
const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const l of WL){const[a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return{p:b[a],l}}return null};
let tally={X:0,O:0,D:0},C,M,playMode='pvp',aiTimer=null;
const isAI=()=>playMode==='cpu';
function modeBar(){return '<div class="mode-label">GAME MODE</div><div class="modebar"><button class="chip '+(playMode==='pvp'?'on':'')+'" data-mode="pvp">👥 2 Players</button><button class="chip '+(playMode==='cpu'?'on':'')+'" data-mode="cpu">🤖 vs Computer</button></div><p class="ai-note">'+(isAI()?'You are X · Computer is O':'Pass the device after each turn')+'</p>'}
function bindMode(game){$('[data-mode]').forEach(b=>b.onclick=()=>{clearTimeout(aiTimer);playMode=b.dataset.mode;tally={X:0,O:0,D:0};if(game==='classic')newC();else newMine()})}
function other(p){return p==='X'?'O':'X'}
function bestMove(board){let best=-Infinity,choice=-1;function score(b,p,d){const w=win(b);if(w)return w.p==='O'?10-d:d-10;if(b.every(Boolean))return 0;const a=[];for(let i=0;i<9;i++)if(!b[i]){b[i]=p;a.push(score(b,other(p),d+1));b[i]=''}return p==='O'?Math.max(...a):Math.min(...a)}for(let i=0;i<9;i++)if(!board[i]){board[i]='O';const v=score(board,'X',1);board[i]='';if(v>best){best=v;choice=i}}return choice}
function scheduleClassicAI(){if(cur!=='ttt'||!isAI()||C.p!=='O'||C.over||C.aiThinking)return;C.aiThinking=1;aiTimer=setTimeout(()=>{if(cur!=='ttt'||!C||C.over||C.p!=='O')return;const i=bestMove(C.b);if(i>=0)C.b[i]='O';C.aiThinking=0;C.w=win(C.b);if(C.w||C.b.every(Boolean)){C.over=1;renderC();end(C.w,newC)}else{C.p='X';renderC()}},450)}
const tl=()=>`<div class="tally"><div class="mX">X wins ${tally.X}</div><div>Draws ${tally.D}</div><div class="mO">O wins ${tally.O}</div></div>`;
const cells=(b,w,sm)=>b.map((v,i)=>`<button class="cell ${sm?'sm':''} ${v?'m'+v:''} ${w&&w.l.includes(i)?'win':''}" data-i="${i}">${v}</button>`).join('');
function end(w,again){
  tally[w?w.p:'D']++;
  setTimeout(()=>overlay({ico:w?'🎉':'🤝',t:w?`${w.p} WINS!`:'DRAW',s:'Nice game.',pl:'Play again',pf:again,b:tl()+'<div style="height:14px"></div>'}),700);
}

/* classic */
function newC(){clearTimeout(aiTimer);C={b:Array(9).fill(''),p:'X',over:0,w:null,aiThinking:0};renderC()}
function renderC(){
 $('#tt').innerHTML=modeBar()+tl()+'<div class="turn"><span class="m'+C.p+'">'+C.p+'</span> '+(isAI()&&C.p==='O'?'(Computer) thinking…':'goes')+'</div><div class="grid" id="cg">'+cells(C.b,C.w)+'</div><p class="hint">'+(isAI()?'You play X. The computer plays O.':'Tap a square; players alternate X and O.')+'</p><button class="btn ghost" id="restart-c">↻ Restart match</button>';
 bindMode('classic');$('#restart-c').onclick=()=>{tally={X:0,O:0,D:0};newC()};
 $('#cg').onclick=e=>{const i=e.target.dataset.i;if(i===undefined||C.over||C.b[i]||(isAI()&&(C.p!=='X'||C.aiThinking)))return;C.b[i]=C.p;C.w=win(C.b);if(C.w||C.b.every(Boolean)){C.over=1;renderC();end(C.w,newC)}else{C.p=other(C.p);renderC()}};
 scheduleClassicAI();
}
/* mine-tac-toe */
function newMine(){clearTimeout(aiTimer);M={mine:Array(9).fill(0),rev:Array(9).fill(0),b:Array(9).fill(''),p:'X',st:'sweep',over:0,w:null,aiThinking:0};roll();renderM()}
function roll(){M.mine=Array(9).fill(0);M.rev=Array(9).fill(0);let n=3;while(n){const i=Math.random()*9|0;if(!M.mine[i]){M.mine[i]=1;n--}}}
function renderM(){
 const sw=M.rev.map((r,i)=>'<button class="cell sm '+(r?(M.mine[i]?'boom':'safe'):'')+'" data-i="'+i+'">'+(r?(M.mine[i]?'💣':'✓'):'?')+'</button>').join('');
 $('#tt').innerHTML=modeBar()+tl()+'<div class="turn"><span class="m'+M.p+'">'+M.p+'</span> '+(isAI()&&M.p==='O'?'(Computer) thinking…':'goes')+'</div><div class="zone '+(M.st==='sweep'?'on':'dim')+'"><h3>Step 1: reveal a cell</h3><div class="grid" id="sg">'+sw+'</div></div><div class="zone '+(M.st==='place'?'on':'dim')+'"><h3>Step 2: place your mark</h3><div class="grid" id="mg">'+cells(M.b,M.w,1)+'</div></div><p class="hint">'+(isAI()?'You are X. Computer is O. Hit a mine and lose your turn.':'Hit a mine and you lose your turn.')+'</p><button class="btn ghost" id="restart-m">↻ Restart match</button>';
 bindMode('mine');$('#restart-m').onclick=()=>{tally={X:0,O:0,D:0};newMine()};
 if(isAI()&&M.p==='O'&&!M.over&&!M.aiThinking)scheduleMineAI();
 $('#sg').onclick=e=>{const i=e.target.dataset.i;if(i===undefined||M.over||M.st!=='sweep'||M.rev[i]||(isAI()&&M.p!=='X'))return;M.rev[i]=1;if(M.mine[i]){renderM();setTimeout(()=>{if(!M||M.over)return;M.p=other(M.p);M.st='sweep';renderM()},600)}else{M.st='place';renderM()}};
 $('#mg').onclick=e=>{const i=e.target.dataset.i;if(i===undefined||M.over||M.st!=='place'||M.b[i]||(isAI()&&M.p!=='X'))return;M.b[i]=M.p;M.w=win(M.b);if(M.w||M.b.every(Boolean)){M.over=1;renderM();end(M.w,newMine);return}M.p=other(M.p);M.st='sweep';if(M.mine.every((v,k)=>v||M.rev[k]))roll();renderM()};
}
function scheduleMineAI(){
 if(cur!=='mine'||!isAI()||M.p!=='O'||M.over||M.aiThinking)return;
 M.aiThinking=1;aiTimer=setTimeout(()=>{
  if(cur!=='mine'||!M||M.over||M.p!=='O')return;
  let choices=M.rev.map((r,i)=>r?-1:i).filter(i=>i>=0);if(!choices.length){roll();choices=M.rev.map((r,i)=>r?-1:i).filter(i=>i>=0)}
  const i=choices[Math.random()*choices.length|0];M.rev[i]=1;
  if(M.mine[i]){M.aiThinking=0;M.p='X';M.st='sweep';renderM();return}
  const move=bestMove(M.b);if(move>=0)M.b[move]='O';M.w=win(M.b);M.aiThinking=0;
  if(M.w||M.b.every(Boolean)){M.over=1;renderM();end(M.w,newMine);return}
  M.p='X';M.st='sweep';if(M.mine.every((v,k)=>v||M.rev[k]))roll();renderM();
 },650);
}

/* ---------- input ---------- */
let t0=null;
$('#stage').addEventListener('touchstart',e=>{t0={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$('#stage').addEventListener('touchend',e=>{
  if(!t0)return;const dx=e.changedTouches[0].clientX-t0.x,dy=e.changedTouches[0].clientY-t0.y;t0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
},{passive:true});
addEventListener('keydown',e=>{
  if(cur!=='snake')return;
  const k={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}[e.key];
  if(k){e.preventDefault();turn(...k)}else if(e.key===' ')$('#pz').click();
});
home();
</script>
</body>
</html>
